<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  
  <!-- Favicons and Web Manifest -->
  <link rel="icon" type="image/x-icon" href="/favicon.ico" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <link rel="manifest" href="/site.webmanifest" />
  
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#fcfbf9" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#1a1614" media="(prefers-color-scheme: dark)" />

  <!-- ========================================== -->
  <!-- Open Graph (Telegram, WhatsApp, Facebook, LinkedIn) -->
  <!-- ========================================== -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Roomora" />
  <meta property="og:title" content="Roomora — Smart Hotel Operations" />
  <meta property="og:description" content="Manage your hotel smartly from one place. Streamline reservations, rooms, and tasks efficiently." />
  <meta property="og:url" content="https://roomora-new.vercel.app" />
  <meta property="og:image" content="https://roomora-new.vercel.app/og-image.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="Roomora — Smart Hotel Operations" />
  <meta property="og:locale" content="en_US" />

  <!-- ========================================== -->
  <!-- Twitter Card -->
  <!-- ========================================== -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Roomora — Smart Hotel Operations" />
  <meta name="twitter:description" content="Manage your hotel smartly from one place." />
  <meta name="twitter:image" content="https://roomora-new.vercel.app/og-image.png" />

  <!-- Applies the saved theme before first paint, so there is no light->dark flash on reload. -->
  <script>
    (function () {
      try {
        var saved = localStorage.getItem("roomora-theme");
        var dark = saved
          ? saved === "dark"
          : window.matchMedia("(prefers-color-scheme: dark)").matches;
        if (dark) document.documentElement.classList.add("dark");
        document.documentElement.style.colorScheme = dark ? "dark" : "light";
      } catch (e) { }
    })();
  </script>

  <title>Roomora — Smart Hotel Operations</title>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
